name: Build profile card
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *" # 00:00 Türkiye time, so the age ticks over at midnight
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/stats.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Update profile card" && git push)
